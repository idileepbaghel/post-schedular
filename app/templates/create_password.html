<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; }
        .form { display: flex; flex-direction: column; gap: 15px; background-color: #ffffff; padding: 40px; width: 100%; border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); border: 1px solid #e0e0e0; }
        .form-header { text-align: center; margin-bottom: 20px; }
        .form-header h2 { color: #125578; font-size: 28px; font-weight: 700; margin-bottom: 5px; }
        .form-header p { color: #666; font-size: 14px; }
        .flex-column { display: flex; flex-direction: column; gap: 5px; }
        .flex-column > label { color: #333; font-weight: 600; font-size: 14px; }
        .inputForm { border: 1.5px solid #ecedec; border-radius: 10px; height: 50px; display: flex; align-items: center; padding: 0 15px; background-color: #fafafa; gap: 10px; }
        .inputForm:focus-within { background-color: #fff; border-color: #125578; }
        .input { border: none; flex-grow: 1; height: 100%; background: transparent; font-size: 14px; outline: none; width: 100%; }
        .inputForm i { color: #999; font-size: 1.2rem; }
        .inputForm:focus-within i.input-icon { color: #125578; }
        .button-submit { margin-top: 15px; background: linear-gradient(135deg, #125578 0%, #0a3a52 100%); border: none; color: white; font-size: 16px; font-weight: 600; border-radius: 10px; height: 50px; width: 100%; cursor: pointer; transition: 0.2s; }
        .button-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(18, 85, 120, 0.4); }
        .password-toggle { cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth_bp.process_create_password') }}">
            <div class="form">
                <div class="form-header">
                    <h2>Set Password</h2>
                    <p>Secure your account for {{ email }}</p>
                </div>

                <input type="hidden" name="email" value="{{ email }}">

                <div class="flex-column">
                    <label>New Password</label>
                    <div class="inputForm">
                        <i class="bi bi-lock input-icon"></i>
                        <input id="new-password" type="password" name="password" class="input" placeholder="Create a Password" required />
                        <i class="bi bi-eye-slash password-toggle" onclick="togglePassword('new-password', this)"></i>
                    </div>
                </div>

                <div class="flex-column">
                    <label>Confirm Password</label>
                    <div class="inputForm">
                        <i class="bi bi-lock-fill input-icon"></i>
                        <input id="confirm-password" type="password" name="confirm_password" class="input" placeholder="Confirm Password" required />
                        <i class="bi bi-eye-slash password-toggle" onclick="togglePassword('confirm-password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="button-submit">Set Password & Login</button>
                
                <div style="text-align: center; margin-top: 15px;">
                    <a href="{{ url_for('auth_bp.signin') }}" style="color: #666; text-decoration: none; font-size: 14px;">Back to Login</a>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove('bi-eye-slash');
                iconElement.classList.add('bi-eye');
            } else {
                input.type = "password";
                iconElement.classList.remove('bi-eye');
                iconElement.classList.add('bi-eye-slash');
            }
        }
    </script>
</body>
</html>
