<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
    <style>
        body { background-color: #f4f6f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 450px; }
        .form { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .form-header h2 { color: #125578; font-weight: 700; margin-bottom: 5px; text-align: center; }
        .btn-submit { background: linear-gradient(135deg, #125578 0%, #0a3a52 100%); color: white; width: 100%; height: 50px; border-radius: 10px; border: none; font-weight: 600; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="form">
            <div class="form-header">
                <h2>Forgot Password</h2>
                <p class="text-center text-muted">Enter your email to reset password</p>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your registered email" required>
            </div>
            <button type="submit" class="btn-submit">Proceed</button>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth_bp.signin') }}" class="text-decoration-none text-muted">Back to Login</a>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
